name: Validate with HACS

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HACS
    runs-on: ubuntu-latest
    env:
      REPOSITORY_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"
          # Tracked in #4. Owner: repo maintainer must add
          # custom_components/liberated_bread/brand/icon.png in this repo or
          # merge a liberated_bread entry in home-assistant/brands.
          ignore: brands
