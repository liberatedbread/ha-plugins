name: Validate with HACS

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        # HACS validates repository/default-branch publication metadata in addition
        # to the checked-out tree. Keep PRs advisory until this import lands on
        # main and the HACS publication prerequisites are completed.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          category: integration
          comment: "false"
