name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # homeassistant 2026.2.3 declares Requires-Python >=3.13.2, so pip
        # cannot resolve any distribution on 3.12.
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiousbwatcher pyserial
          python -m pip install pycryptodome>=3.20.0 defusedxml>=0.7.0
          python -m pip install pytest pytest-asyncio pytest-cov ruff homeassistant==2026.2.3 pytest-homeassistant-custom-component==0.13.316

      - name: Lint
        run: ruff check custom_components/liberated_bread

      - name: Test
        run: pytest --cov=custom_components.liberated_bread tests
