device:
  name: ThermoPro TempSpike / TP9xx BBQ Thermometer
  manufacturer: ThermoPro (Adsmart)
  model: TP9012, TP940, TP980 (BLE Mesh series)
  category: kitchen
  type: bbq-thermometer
  transport: ble_mesh
  protocol: ble_mesh_gatt_proxy
  manufacturer_status: production
  notes: |
    Extracted from com.thermopro.thermopro v1.21 (87MB, TempPro APKPure XAPK).
    Decompiled: 14,930 classes. Package: cn.com.adsmart.wifibbq.
    ThermoPro uses BLE Mesh (not simple BLE GATT) for multi-probe BBQ thermometers.
    Adsmart is the OEM behind ThermoPro's connected devices.
    BLE Mesh GATT Proxy: The phone connects as a GATT proxy to the mesh network.
    Mesh operations: opcodes, TTL, IV index, sequence numbers, publish intervals,
    segmented messages, source/destination addressing.
    Three distinct device change-utility families identified in the code:
    TP9012, TP940 (4-probe BBQ), TP980 (advanced with history and IEEE 754 float encoding).

ble:
  service_uuid: "1086FFF0-3343-4817-8BB2-B32206336CE8"
  characteristics:
    - uuid: "1086FFF1-3343-4817-8BB2-B32206336CE8"
      name: ReadWrite
      type: write
      description: BLE Mesh GATT proxy read/write characteristic for mesh commands
    - uuid: "1086FFF2-3343-4817-8BB2-B32206336CE8"
      name: Notification
      type: notify
      description: BLE Mesh GATT proxy notification characteristic for mesh responses

mesh_protocol:
  description: |
    ThermoPro uses standard BLE Mesh v1.0/1.1 with the GATT Proxy bearer.
    The phone acts as a mesh provisioner, configuring the thermometer node.
    Mesh PDUs contain opcodes (1-3 octets), TTL, IV index, sequence numbers,
    and segmented lower transport for messages exceeding the MTU.
  supported_pdu_types:
    - NETWORK_PDU
    - PROXY_CONFIG
    - SEGMENTED_ACCESS
    - SEGMENTED_CONTROL
  addressing:
    source: unicast_address (node element address)
    destination: unicast or group address

device_families:
  - model: TP9012
    description: Basic 2-probe BBQ thermometer
    probe_count: 2
    temperature_encoding: u16le_split
    temperature_encoding_detail: "(byteHigh * 256 + byteLow) / 10.0 °C — getProTemp() from two separate bytes"
    command_opcodes:
      - code: 0xB0
        name: DEVICE_CHECK
        description: Device discovery/check reply
      - code: 0xB2
        name: TEMP_AND_BATTERY_UPLOAD
        description: Temperature and battery status upload. Bytes [2,3] = probe 1 temp, [4,5] = probe 2 temp
      - code: 0xB3
        name: REMOVE_ALARM
        description: Clear probe alarm
    data_format:
      temp_upload:
        - byte_offset: 0
          size: 1
          name: opcode
          value: 0xB2
        - byte_offset: 1
          size: 1
          name: battery_percent
        - byte_offset: 2
          size: 2
          name: probe1_temp_raw
          description: "(high * 256 + low) / 10.0 °C"
        - byte_offset: 4
          size: 2
          name: probe2_temp_raw
          description: "(high * 256 + low) / 10.0 °C"

  - model: TP940
    description: Advanced 4-probe BBQ thermometer with meat temperature settings
    probe_count: 4
    temperature_encoding: u16le_split
    temperature_encoding_detail: "(byteHigh * 256 + byteLow) / 10.0 °C"
    features:
      - meat_temp_target_setting
      - temp_unit_change (C/F)
      - alarm_per_probe
      - probe_disconnect_detection (-999.9°C sentinel)
    protocol_notes: |
      Multi-request flow for reading all probes. Index-based probing:
      0→1→2→3→4 sequentially via setTemp(). Probe disconnect 
      indicated by -999.9°C value.

  - model: TP980
    description: Pro-grade thermometer with history and IEEE 754 float encoding
    probe_count: 4
    temperature_encoding: ieee754_float32
    temperature_encoding_detail: "32-bit IEEE 754 floating point (Java float) in big-endian byte order"
    features:
      - temperature_history_upload
      - temp_unit_change
      - per_probe_target_temp
      - sequential_multi_probe_read
    protocol_notes: |
      Uses IEEE 754 float32 instead of integer encoding. 
      History upload: multi-segment BLE Mesh messages with 
      first-chunk and continuation flags. Probe reading uses 
      setTemp(0..3) flow with response-based state machine.

advertising:
  discovery_method: service_uuid_and_name
  local_name_prefixes:
    - "TP"
    - "TempPro"
    - "BBQ"
    - "iBBQ"

mesh_parameters:
  ttl:
    default: 5 (USE_DEFAULT_TTL)
    min: 0
    max: 127
  publish_ttl:
    prohibited: [0, 1, 2, 3] # PROHIBITED_PUBLISH_TTL_MIN..MAX
    default: 5
  iv_index:
    valid_range: [0, 0xFFFFFFFF]
  unicast_address:
    valid_range: [1, 0x7FFF]  # 15-bit
  sequence_number:
    valid_range: [0, 0xFFFFFF]  # 24-bit
  retransmit:
    default_interval_steps: 2
  probe_time_units:
    - RESOLUTION_100_MS
    - RESOLUTION_1_S
    - RESOLUTION_10_S
    - RESOLUTION_10_M

source:
  apk: com.thermopro.thermopro v1.21 (TempPro_1.21_APKPure.xapk, 87MB)
  decompiled: jadx (14,930 classes)
  key_sdk_paths:
    - cn/com/adsmart/wifibbq/ble/config/TPBleConfig.java
    - cn/com/adsmart/wifibbq/ble/utils/TP9012ChangeUtils.java
    - cn/com/adsmart/wifibbq/ble/utils/TP940ChangeUtils.java
    - cn/com/adsmart/wifibbq/ble/utils/TP980ChangeUtils.java
    - cn/com/adsmart/wifibbq/ble/utils/ParserUtils.java
  date_extracted: "2026-07-28"
