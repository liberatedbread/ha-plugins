advertising:
  discovery_method: manufacturer_data
  manufacturer_data_format:
    - byte_offset: 0
      name: manufacturer_id
      size: 2
      description: "0xDC00 (Procter & Gamble)"
    - byte_offset: 2
      name: product_type
      size: 1
      description: Brush or Charger type identifier
    - byte_offset: 3
      name: reserved
      size: 1
      description: Always 0x00
    - byte_offset: 4
      name: data_length
      size: 1
      description: Manufacturer data payload length
    - byte_offset: 5
      name: brush_type
      size: 1
      description: Brush model variant (iO 3-10)
    - byte_offset: 6
      name: state
      size: 1
      description: Device state flags
    - byte_offset: 7
      name: protocol_version
      size: 1
      description: Protocol version (V001-V009)
    - byte_offset: 8
      name: battery
      size: 1
      description: Battery level
    - byte_offset: 9
      name: mode
      size: 1
      description: Current brushing mode
    - byte_offset: 10
      name: pressure
      size: 1
      description: Pressure sensor value
    - byte_offset: 11
      name: timer
      size: 1
      description: Brushing timer seconds
    - byte_offset: 12
      name: smiley
      size: 1
      description: Brushing quality smiley
    - byte_offset: 13
      name: quadrant
      size: 1
      description: Current quadrant
    - byte_offset: 14
      name: errors
      size: 1
      description: Error flags
  minimum_length: 14

