# iLEDColor LED Panel — Device Spec
# Generated from static analysis of com.led.iledcolor
# APK source: apkeep (Google Play mirror)
# XAPK SHA-256: df33e91e2467f7c379bcaa7b497bb1bed91aea9a282817b1af632283d79f1505

device:
  name: "iLEDColor LED Matrix Panel (DreamPanel v3)"
  manufacturer: "Shenzhen I-ledshow Technology Co., Ltd."
  manufacturer_status: "active"
  protocol: "ble"
  notes: >
    This app replaced SPOTLED for DreamPanel v3 hardware (horizontal serial
    number). Built on JieLi (JL) Bluetooth OTA SDK. LED command format is
    embedded in JL proprietary protocol inside native libraries.

    LED control commands are sent through the JL OTA data pipe (0000ae01).
    The actual LED command format (brightness, image upload, GIF frames) is
    embedded within JL's proprietary protocol and encoded in native .so libraries.
    Static analysis cannot recover the command format — HCI snoop is essential.

    Architecture: JieLi (JL) Bluetooth OTA SDK with native .so libraries.
    BLE Manager: ec/c.java, OTA Handler: ec/f.java, Send Thread: ec/i.java.

    SPOTLED compatibility probe: check service 0000ff20-0000-1000-8000-00805f9b34fb.

    Research status: APK acquired and decompiled. JL OTA service UUIDs recovered.
    LED command format in native libs — needs HCI snoop. Native reverse-
    engineering may be required if snoop is unavailable.

services:
  - uuid: "0000ae00-0000-1000-8000-00805f9b34fb"
    name: "JL OTA Service"
    notes: "JieLi Bluetooth OTA service (used for data transport)."
    characteristics:
      - uuid: "0000ae01-0000-1000-8000-00805f9b34fb"
        name: "JL OTA Write"
        notes: "JL OTA write characteristic (data/commands to device)."
        properties: ["write", "write_without_response"]
      - uuid: "0000ae02-0000-1000-8000-00805f9b34fb"
        name: "JL OTA Notify"
        notes: "JL OTA notification characteristic."
        properties: ["notify"]
